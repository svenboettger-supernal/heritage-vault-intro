<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Meet Heritage Vault</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Public+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f5f6f3; --paper:#fdfdfb; --ink:#161d19; --muted:#5f6a64; --line:#d5dad4;
  --accent:#1e4b3a; --accent-soft:#e2ece6;
  --display:"Source Serif 4",Georgia,serif; --body:"Public Sans",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#131816; --paper:#1a211d; --ink:#edf1ee; --muted:#9aa69f; --line:#2d3732;
  --accent:#8fcaa9; --accent-soft:#1f3329; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131816; --paper:#1a211d; --ink:#edf1ee; --muted:#9aa69f; --line:#2d3732;
  --accent:#8fcaa9; --accent-soft:#1f3329; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;padding:32px 16px 64px}
main{max-width:960px;margin:0 auto;display:grid;gap:28px}
.brand{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500}
.brand b{color:var(--accent);font-weight:600}
header{display:grid;gap:12px;max-width:640px}
h1{font-family:var(--display);font-weight:500;font-size:clamp(32px,5vw,48px);line-height:1.08;letter-spacing:-.01em;margin:0;text-wrap:balance}
header p{margin:0;font-size:17px;color:var(--muted);text-wrap:pretty}
.player{background:var(--paper);border:1px solid var(--line);padding:10px}
video{display:block;width:100%;aspect-ratio:16/9;height:auto;background:#0d1210}
.meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:13px;color:var(--muted);padding:10px 4px 2px}
footer{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<main>
  <div class="brand"><b>Supernal</b> &times; Heritage</div>
  <header>
    <h1>Meet Heritage Vault</h1>
    <p>A short film about Heritage Vault. It shows how the whole estate comes together in one place: family, assets, insurance and documents, all online.</p>
  </header>
  <section class="player" aria-label="Video">
    <video controls playsinline preload="metadata"
      poster="https://svenboettger-supernal.github.io/heritage-vault-intro/poster.jpg">
      <source src="https://svenboettger-supernal.github.io/heritage-vault-intro/heritage-vault-intro.mp4" type="video/mp4">
      Your browser can't play this video.
    </video>
    <div class="meta"><span>Heritage Vault intro</span><span>About 2 minutes, with sound</span></div>
  </section>
  <footer>Made by Supernal for Heritage.</footer>
</main>
</body>
</html>
